[package]
name = "edlr-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "edlr"
path = "src/bin/edlr.rs"

[dependencies]
edlr-config = { path = "../config" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
wasmtime = { version = "47.0.2", features = ["component-model"] }
anyhow = "1.0.104"
wasmtime-wasi = "47.0.2"
url = "2.5.8"
sha2 = "0.10"
edlr-driver-http = { path = "../drivers/http" }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"
futures-util = "0.3"
