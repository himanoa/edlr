id = "inara-uploader"
name = "INARA Uploader"
version = "0.1.0"
description = "Journal イベントを INARA (inara.cz) へアップロードする"
entry = "plugin.wasm"

# 変換対象の Journal イベント。ここに無いイベントはプラグインへ届かない。
events = [
  "Commander",
  "LoadGame",
  "FSDJump",
  "CarrierJump",
  "Docked",
  "Location",
  "Rank",
  "Progress",
  "Reputation",
  "EngineerProgress",
  "Materials",
  "Statistics",
  "Died",
  "Shutdown",
]

[[capabilities]]
kind = "http"
hosts = ["https://inara.cz"]
reason = "Journal イベントを INARA の API へアップロードするため"

# Journal から学習した状態(コマンダー名・gameversion)の保存先。edlr は
# Journal の読み取り位置を永続化していて LoadGame は再配信されないため、
# ここへ保存しないとセッション途中のデーモン再起動で Live ゲートが閉じた
# ままになり、以後のイベントを送れなくなる。
[[filesystem]]
name = "state"
mode = "read-write"
reason = "Journal から学習したコマンダー名とゲームバージョンを再起動をまたいで保持するため"

# 直近のイベントで送り切れなかった端数を定期的に拾い上げる。
# minIntervalSeconds は uploader 側で尊重するので、ここでの間隔と一致
# していなくても連打にはならない。
[[schedule]]
name = "flush"
interval-seconds = 60

[[settings]]
key = "enabled"
label = "有効"
type = "boolean"
default = true

# `secret` 型: Plugins 画面ではマスク入力になり、`plugins/list` /
# `plugins/get-settings` の応答には含まれない(write-only)。
# 保存先の <settings-dir>/inara-uploader.json 上は依然として平文なので、
# ファイル自体の保護は OS のパーミッションに委ねている。
[[settings]]
key = "apiKey"
label = "INARA API キー"
type = "secret"

# 空ならプラグインが Journal の LoadGame / Commander から学習する。
[[settings]]
key = "commanderName"
label = "コマンダー名(空なら Journal から自動取得)"
type = "string"
default = ""

# INARA 側で「開発中のクライアント」として扱わせるフラグ。動作確認が
# 済むまでは true のままにしておくこと。
[[settings]]
key = "isBeingDeveloped"
label = "開発モードで送信する"
type = "boolean"
default = true

[[settings]]
key = "batchSize"
label = "まとめて送るイベント数"
type = "number"
default = 10

[[settings]]
key = "minIntervalSeconds"
label = "送信の最短間隔(秒)"
type = "number"
default = 60

# edlr は Journal の読み取り位置を永続化しており、再起動しても続きから配信する。
# そのため既定 (true) で送っても二重送信にはならない。false にすると、デーモンが
# 止まっていた間に書かれたイベントは INARA へ送られない(欠測になる)。
[[settings]]
key = "uploadHistorical"
label = "デーモン起動前に書かれていたイベントも送る"
type = "boolean"
default = true

[[settings]]
key = "dryRun"
label = "送信せずログに出すだけ"
type = "boolean"
default = false
