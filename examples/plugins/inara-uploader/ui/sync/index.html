<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 4px 0;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
      #status {
        margin-top: 8px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <button id="resync">現行セッションを再送</button>
    <p id="status">未送信分を INARA へ送り直します。進捗はログ画面で確認できます。</p>
    <script src="/plugin-ui-sdk.js"></script>
    <script>
      var button = document.getElementById("resync");
      var status = document.getElementById("status");
      button.addEventListener("click", function () {
        edlr.action("resync");
        status.textContent =
          "再送をリクエストしました(" +
          new Date().toLocaleTimeString() +
          ")。結果はログ画面で確認できます。";
        edlr.reportHeight();
      });
      edlr.ready();
      edlr.reportHeight();
    </script>
  </body>
</html>
