[package]
name = "edlr-ui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
edlr-config = { path = "../../config" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
